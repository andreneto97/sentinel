name: CI

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bun test

  deploy:
    runs-on: self-hosted
    environment: production
    permissions:
      contents: write
      id-token: write
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        run: ./deploy.sh
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          AWS_ROLE: ${{ secrets.AWS_DEPLOY_ROLE }}
