# Override file for the extended emulator image
# Use with: docker compose -f compose.yml -f compose-emulator-extras.yml up
#
# The shape a real override file has: `build:` names a Dockerfile and no context,
# because the context comes from the file this one is merged with.
services:
  localstack:
    build:
      dockerfile: ./ops/pinned/Dockerfile
    privileged: true
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock'
