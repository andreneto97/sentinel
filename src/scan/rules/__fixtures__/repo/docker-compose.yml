services:
  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: admin
    volumes:
      - /var/lib/postgresql/data:/var/lib/postgresql/data
  api:
    image: myorg/api:latest
    privileged: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=changeme
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./src:/app/src
  cache:
    image: redis:7.2-alpine
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - cache-data:/data
volumes:
  cache-data:
